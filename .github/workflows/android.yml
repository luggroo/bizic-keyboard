name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android toolchain
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Test shared input engine
        run: ./tools/test-core.sh
      - name: Test offline handwriting model
        run: |
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 -o "$RUNNER_TEMP/onnxruntime.jar" https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime/1.20.0/onnxruntime-1.20.0.jar ||
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 -o "$RUNNER_TEMP/onnxruntime.jar" https://maven-central.storage-download.googleapis.com/maven2/com/microsoft/onnxruntime/onnxruntime/1.20.0/onnxruntime-1.20.0.jar
          ./tools/test-ismantic.sh "$RUNNER_TEMP/onnxruntime.jar"
      - name: Check prediction training and reviewed syllable meanings
        run: |
          python3 qa/test_survey_loans.py
          python3 qa/test_prediction_training.py
          python3 qa/test_syllable_senses.py
          python3 qa/test_candidate_senses.py
          python3 qa/test_orthography_revisions.py
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleHandwritingDebug :app:assembleTypingOnlyDebug
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/handwriting/debug/app-handwriting-debug.apk'
      - name: Verify typing-only APK
        run: |
          apk=app/build/outputs/apk/typingOnly/debug/app-typingOnly-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          python3 qa/verify-apk.py --typing-only "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: bizic-keyboard-typing-only-debug
          path: app/build/outputs/apk/typingOnly/debug/app-typingOnly-debug.apk
          if-no-files-found: error
      - name: Verify bundled dictionaries and native libraries
        run: python3 qa/verify-apk.py app/build/outputs/apk/handwriting/debug/app-handwriting-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bizic-keyboard-debug
          path: app/build/outputs/apk/handwriting/debug/app-handwriting-debug.apk
          if-no-files-found: error

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Android Lint
        run: ./gradlew --no-daemon :app:lintHandwritingDebug :app:lintTypingOnlyDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: app/build/reports/lint-results-*
