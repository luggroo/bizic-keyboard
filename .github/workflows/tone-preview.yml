name: Vowel tone screenshot
on:
  pull_request:
    paths:
      - '.github/workflows/tone-preview.yml'
      - 'app/src/main/java/biz/tujia/ime/TujiaIme.java'
      - 'device-test/**'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install build tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build keyboard and test host
        run: |
          mkdir -p build
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk build/qa-keyboard.apk
          ./tools/build-apk.sh --device-test build/fixture.apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture tone hints and picker
        env:
          TUJIA_E2E_SUITE: tone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash qa/ci-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tone-screenshots
          path: build/device-qa/
          if-no-files-found: warn
