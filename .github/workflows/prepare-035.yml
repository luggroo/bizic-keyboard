name: Prepare unsigned Android 0.3.5

on:
  pull_request:
    paths: [".github/workflows/prepare-035.yml"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50b9bdcb309bf34362f9fb386b1955c435b75045
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install Android toolchain
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build and verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 50b9bdcb309bf34362f9fb386b1955c435b75045
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p build/release-output
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/release-output/tujia-keyboard-0.3.5-unsigned.apk
          apk=build/release-output/tujia-keyboard-0.3.5-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='biz.tujia.ime' versionCode='11' versionName='0.3.5'"
          python3 qa/verify-apk.py "$apk"
          cd build/release-output
          sha256sum tujia-keyboard-0.3.5-unsigned.apk > SHA256SUMS
          printf 'Unsigned release APK; sign with the existing release key before installation or updating.\nSource commit: 50b9bdcb309bf34362f9fb386b1955c435b75045\n' > README.txt
          zip -q tujia-keyboard-0.3.5-signing-input.zip tujia-keyboard-0.3.5-unsigned.apk SHA256SUMS README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tujia-keyboard-0.3.5-signing-input
          path: build/release-output/tujia-keyboard-0.3.5-signing-input.zip
          if-no-files-found: error
