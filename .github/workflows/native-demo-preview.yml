name: Record Android demo preview

on:
  pull_request:
    paths:
      - '.github/workflows/native-demo-preview.yml'
      - 'tools/story-demo/**'
  workflow_dispatch:
    inputs:
      scene:
        description: 'Scene to record (all, song, handwriting, prediction, tone, readings)'
        default: all
        type: choice
        options: [all, song, handwriting, prediction, tone, readings]

permissions:
  contents: read

jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON((!inputs.scene || inputs.scene == 'all') && '["song","handwriting","prediction","tone","readings"]' || format('["{0}"]', inputs.scene)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk python3-pil
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Prepare keyboard and notes app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/demo
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            gh release download v0.3.6 -p tujia-keyboard-0.3.6.apk -p SHA256SUMS -D build/demo
            (cd build/demo && sha256sum --check --ignore-missing SHA256SUMS)
            mv build/demo/tujia-keyboard-0.3.6.apk build/demo/keyboard.apk
          else
            ./gradlew --no-daemon :app:assembleHandwritingDebug
            cp app/build/outputs/apk/handwriting/debug/app-handwriting-debug.apk build/demo/keyboard.apk
          fi
          ./tools/build-apk.sh --device-test build/demo/device-test.apk
          ./tools/story-demo/build-notes.sh build/demo/story-notes.apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record real Android keyboard
        env:
          DEMO_SCENE: ${{ matrix.scene }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/story-demo/record-release-demo.sh "$DEMO_SCENE"
      - uses: actions/upload-artifact@v4
        with:
          name: native-demo-${{ matrix.scene }}
          path: build/demo/movies/*.mp4
          if-no-files-found: error
