name: Record Android demo preview

on:
  pull_request:
    paths:
      - '.github/workflows/native-demo-preview.yml'
      - 'tools/story-demo/**'
      - 'app/src/main/**'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk python3-pil
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build keyboard and independent notes app
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          mkdir -p build/demo "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android \
              -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          ./tools/story-demo/build-notes.sh build/demo/story-notes.apk
          ./tools/build-apk.sh --device-test build/demo/device-test.apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record real Android keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install build/demo/story-notes.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell ime enable biz.tujia.ime/.TujiaIme
            adb shell ime set biz.tujia.ime/.TujiaIme
            python3 tools/story-demo/film-song.py build/demo/recording
            adb shell screenrecord --time-limit 180 --bit-rate 4000000 /sdcard/tone-demo.mp4 &
            recording_pid=$!
            set +e
            TUJIA_E2E_SUITE=tone ./device-test/run.sh app/build/outputs/apk/debug/app-debug.apk build/demo/device-test.apk
            result=$?
            adb shell 'for p in $(pidof screenrecord); do kill -2 "$p"; done' || true
            wait "$recording_pid" || true
            set -e
            adb pull /sdcard/tone-demo.mp4 build/demo/recording/tone-demo.mp4
            test "$result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-keyboard-demo-preview
          path: build/demo/recording/
          if-no-files-found: warn
