name: Publish handwriting layout preview

on: workflow_dispatch

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/dist/handwriting-layout-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish the tested preview
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.3.6-handwriting-layout
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD^)"
          sha256sum -c SHA256SUMS
          apk=tujia-keyboard-0.3.6-handwriting-layout.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          python3 ../qa/verify-apk.py "$apk"
          gh release create "$tag" --verify-tag --prerelease --latest=false \
            --title '手写布局测试版 · 0.3.6' \
            --notes '手写区放在左侧，退格键与拼音、音标模式对齐。此测试版包含试打框修复，可以覆盖安装 0.3.6。' \
            "$apk#手写布局测试版 APK" 'handwriting-backspace-150.png#150% 字号截图' SHA256SUMS
