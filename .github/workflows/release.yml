name: Publish 0.3.6 trial keyboard APKs

on: workflow_dispatch

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/dist/v0.3.6-trial2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish the tested APKs
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.3.6-trial2
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD^)"
          sha256sum -c SHA256SUMS
          for apk in *.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          done
          gh release create "$tag" --verify-tag --prerelease --latest=false \
            --title '北部土家语输入法 0.3.6 · 试打框修复测试版 2' \
            --notes '修复内置试打框选词和退格失效的问题。请按需下载手写版或无手写版，直接覆盖安装 0.3.6。' \
            'tujia-keyboard-0.3.6-trial2-handwriting.apk#手写版 APK' \
            'tujia-keyboard-0.3.6-trial2-no-handwriting.apk#无手写版 APK' SHA256SUMS
