name: Publish signed Android preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example v0.3.0)'
        required: true
      bundle_commit:
        description: 'Full commit SHA from the distribution branch containing release-assets/'
        required: true

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      BUNDLE: ${{ inputs.bundle_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the signed APK against its source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$BUNDLE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "refs/remotes/origin/dist/$VERSION")" = "$BUNDLE"
          test "$(git rev-parse "$BUNDLE^")" = "$GITHUB_SHA"
          git restore --source="$BUNDLE" --worktree -- release-assets
          cd release-assets
          sha256sum -c SHA256SUMS
          readings=wenbai-jishou-chongqing.xlsx
          if [[ "$VERSION" == v0.3.3 || -f "$readings" ]]; then
            grep -Fxq -- "$(sha256sum "$readings")" SHA256SUMS
            unzip -tqq "$readings"
            unzip -p "$readings" xl/workbook.xml >/dev/null
          fi
          readings_movie=jishou-readings-android.mp4
          if [[ "$VERSION" == v0.3.3 || -f "$readings_movie" ]]; then
            grep -Fxq -- "$(sha256sum "$readings_movie")" SHA256SUMS
            test "$(head -c 8 "$readings_movie" | tail -c 4)" = ftyp
          fi
          apk="tujia-keyboard-${VERSION#v}.apk"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          verify_apk() {
            local file="$1"
            shift
            grep -Fxq -- "$(sha256sum "$file")" SHA256SUMS
            "$signer" verify --verbose "$file"
            python3 ../qa/verify-apk.py --aapt "$aapt" "$@" "$file"
            local package_info
            package_info=$("$aapt" dump badging "$file")
            [[ "$package_info" == "package: name='biz.tujia.ime'"*"versionName='${VERSION#v}'"* ]]
          }
          verify_apk "$apk"
          cert() { "$signer" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'; }
          full_cert=$(cert "$apk")
          # Certificate SHA-256 of both published v0.3.6 APKs. Android upgrades require it.
          [[ "$full_cert" == 76a10e80a87bd4a6e5eab23767a303e5c8f7652eaaaa741df10f4c905f20773b ]]
          lite="${apk%.apk}-no-handwriting.apk"
          if [[ "$VERSION" == v0.3.6 || -f "$lite" ]]; then
            verify_apk "$lite" --typing-only
            [[ "$full_cert" == "$(cert "$lite")" ]]
          fi
      - name: Publish release attachments
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          extras=()
          lite="tujia-keyboard-${VERSION#v}-no-handwriting.apk"
          if [[ -f "$lite" ]]; then extras+=("$lite"); fi
          if [[ -f one-tap.mp4 ]]; then extras+=(one-tap.mp4); fi
          if [[ -f wenbai-jishou-chongqing.xlsx ]]; then extras+=(wenbai-jishou-chongqing.xlsx); fi
          if [[ -f jishou-readings-android.mp4 ]]; then extras+=(jishou-readings-android.mp4); fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "北部土家语输入法 ${VERSION#v}" \
            --notes-file NOTES.md "tujia-keyboard-${VERSION#v}.apk" shange-demo.mp4 \
            continuous-handwriting.mp4 shange-demo.zip orthography.xlsx SHA256SUMS "${extras[@]}"
