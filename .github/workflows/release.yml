name: Publish verified 0.3.6 demo assets
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      bundle_commit:
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/dist/demos-v0.3.6' && inputs.version == 'v0.3.6' && inputs.bundle_commit == github.sha
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.3.6
    steps:
      - uses: actions/checkout@v4
      - name: Verify media and merge checksums with the published APK manifest
        working-directory: demos
        run: |
          set -euo pipefail
          sha256sum -c DEMOS.sha256
          unzip -tq shange-demo.zip
          gh release download "$RELEASE_TAG" -p SHA256SUMS -D "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          def entries(path):
              return dict(line.split('  ', 1)[::-1] for line in path.read_text().splitlines() if line)
          hashes = entries(tmp/'SHA256SUMS')
          published = {a['name']: a['digest'].removeprefix('sha256:') for a in json.loads((tmp/'release.json').read_text())['assets']}
          for name,digest in hashes.items():
              assert published[name] == digest, name
          hashes.update(entries(Path('DEMOS.sha256')))
          Path('SHA256SUMS').write_text(''.join(f'{hashes[n]}  {n}\n' for n in sorted(hashes)))
          PY
      - name: Publish demo downloads and links
        working-directory: demos
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" *.mp4 *.zip --clobber
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --notes-file NOTES.md
