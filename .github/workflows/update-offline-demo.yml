name: Build single-file offline demo
# Publish the grouped handwriting suggestions in the downloadable demo.

on:
  pull_request:
    paths: ['.github/workflows/update-offline-demo.yml', 'tools/web-demo/**', 'shared/**', 'app/src/main/assets/ismantic/**']
  push:
    branches: [main]
    paths: ['.github/workflows/update-offline-demo.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WASI and ONNX Runtime
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/wasi.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          tar -xzf "$RUNNER_TEMP/wasi.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm pack onnxruntime-web@1.20.0 --silent
          mkdir onnx
          tar -xzf onnxruntime-web-1.20.0.tgz -C onnx
          npm install --no-save --prefix "$RUNNER_TEMP/dom" jsdom@26
      - name: Build and check offline demo
        run: |
          set -euo pipefail
          mkdir -p build/web build/artifacts
          cp -R tools/web-demo/ui/. build/web/
          WASI_SDK_PATH="$RUNNER_TEMP/wasi-sdk-25.0-x86_64-linux" tools/web-demo/build-core.sh build/input.wasm
          python3 tools/web-demo/embed-core.py build/input.wasm build/web/engine-data.js
          python3 tools/web-demo/embed-hand-model.py "$RUNNER_TEMP/onnx/package/dist" build/web
          node tools/web-demo/test-offline.cjs build/web "$RUNNER_TEMP/onnx/package/dist"
          python3 tools/web-demo/package.py build/web build/artifacts --version 0.3.3
          NODE_PATH="$RUNNER_TEMP/dom/node_modules" node tools/web-demo/test-dom.cjs build/artifacts/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: single-file-shange-demo
          path: build/artifacts/shange-demo.zip
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: single-file-shange-demo
          path: build/artifacts
      - name: Update the latest release demo and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir build/artifacts
          cd build/artifacts
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('SHA256SUMS')
          lines = p.read_text().splitlines()
          indices = [i for i, line in enumerate(lines) if line.endswith('  shange-demo.zip')]
          if len(indices) != 1:
              raise SystemExit('Expected one existing demo checksum')
          lines[indices[0]] = hashlib.sha256(Path('shange-demo.zip').read_bytes()).hexdigest() + '  shange-demo.zip'
          p.write_text('\n'.join(lines) + '\n')
          PY
          gh release upload "$tag" shange-demo.zip SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
