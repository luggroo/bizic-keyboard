name: Android device QA
run-name: Mobile QA · main 841c73f

on:
  push:
    branches: [qa/mobile-841c73f]

permissions:
  contents: read

jobs:
  ime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: default
          - api: 28
            target: google_apis
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 841c73fff06693e6c73247c7d65b3b32ed5e73db
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install native toolchain
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build keyboard and test host
        run: |
          mkdir -p build
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk build/qa-keyboard.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/qa-keyboard.apk
          ./tools/build-apk.sh --device-test build/fixture.apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise installed input method
        env:
          TUJIA_E2E_SUITE: all
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash qa/ci-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-device-evidence
          path: build/device-qa/
          if-no-files-found: warn
