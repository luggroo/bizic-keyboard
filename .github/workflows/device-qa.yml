name: Android device QA
run-name: Android device QA · ${{ github.event_name == 'pull_request' && 'IPA regression' || inputs.suite }} ${{ inputs.release_tag }}

on:
  pull_request:
    paths:
      - '.github/workflows/device-qa.yml'
      - 'app/src/main/assets/ipa-completions.tsv'
      - 'app/src/main/java/biz/tujia/ime/IpaKeyboard.java'
      - 'app/src/main/java/biz/tujia/ime/TujiaIme.java'
      - 'device-test/**'
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level (28 for Android 9, 35 for Android 15)'
        type: choice
        default: '35'
        options: ['35', '28']
      suite:
        description: 'Device suite'
        type: choice
        default: all
        options: [all, core, host, web, window, sounds, compact, long-word, typography, han-senses, regional, hand-words, ipa]
      release_tag:
        description: 'Optional release tag (for example v0.3.0). Leave blank to build this commit.'
        type: string
        default: ''
      apk_sha256:
        description: 'Expected SHA-256 of the release APK. Required when testing a release.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ime:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request'
        && '{"include":[{"api-level":28,"suite":"ipa"},{"api-level":35,"suite":"ipa"},{"api-level":35,"suite":"all"}]}'
        || format('{{"include":[{{"api-level":{0},"suite":"{1}"}}]}}', inputs.api_level || '35', inputs.suite || 'all')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install native toolchain
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build keyboard and test host
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          mkdir -p build
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$APK_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "tujia-keyboard-${RELEASE_TAG#v}.apk" --output build/qa-keyboard.apk
            echo "$APK_SHA256  build/qa-keyboard.apk" | sha256sum --check
          else
            [[ -z "$APK_SHA256" ]]
            ./gradlew --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk build/qa-keyboard.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/qa-keyboard.apk
          ./tools/build-apk.sh --device-test build/fixture.apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise installed input method
        env:
          TUJIA_E2E_SUITE: ${{ matrix.suite }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash qa/ci-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api-level }}-${{ matrix.suite }}-device-evidence
          path: build/device-qa/
          if-no-files-found: warn
