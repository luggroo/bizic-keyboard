name: Android device QA
run-name: Mobile QA · handwriting and input

on:
  push:
    branches: [qa/mobile-verify-a2e2d30]

permissions:
  contents: read
  actions: read

jobs:
  ime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: default
          - api: 28
            target: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Download verified main APK
        uses: actions/download-artifact@v4
        with:
          name: bizic-keyboard-debug
          github-token: ${{ github.token }}
          run-id: 45500276727
          path: build/main-apk
      - name: Build test host
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          cp build/main-apk/app-debug.apk build/qa-keyboard.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/qa-keyboard.apk
          ./tools/build-apk.sh --device-test build/fixture.apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise installed input method
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash qa/ci-mobile-focused.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-device-evidence
          path: build/device-qa/
          if-no-files-found: warn
