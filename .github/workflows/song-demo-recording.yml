name: Record current song demo

on:
  pull_request:
    paths:
      - '.github/workflows/song-demo-recording.yml'
      - 'tools/story-demo/**'

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          python3 -m pip install --user pillow
      - name: Build current keyboard and notes host
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          mkdir -p build/song-demo
          mkdir -p "$HOME/.android"
          test -f "$HOME/.android/debug.keystore" || keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          ./tools/story-demo/build-notes.sh build/song-demo/notes.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > build/song-demo/keyboard-sha256.txt
          git rev-parse HEAD > build/song-demo/source-commit.txt
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record the real Android keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell wm size 480x800
            adb shell wm density 160
            adb shell settings put system font_scale 1.0
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install build/song-demo/notes.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell ime enable biz.tujia.ime/.TujiaIme
            adb shell ime set biz.tujia.ime/.TujiaIme
            python3 tools/story-demo/film-song.py build/song-demo
      - name: Save video and recording evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shange-demo-latest-main
          path: |
            build/song-demo/shange-half-speed.mp4
            build/song-demo/saved-note.txt
            build/song-demo/song-input.tsv
            build/song-demo/run.log
            build/song-demo/film-events.tsv
            build/song-demo/source-commit.txt
            build/song-demo/keyboard-sha256.txt
          if-no-files-found: error
