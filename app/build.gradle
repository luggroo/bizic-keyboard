plugins {
    id 'com.android.application'
}

android {
    namespace 'biz.tujia.ime'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'biz.tujia.ime'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.3.1'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('../shared/CMakeLists.txt')
            version '3.22.1'
        }
    }
    sourceSets {
        main.assets.srcDirs = ['../shared/bundle/Assets']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
