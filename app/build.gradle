plugins {
    id 'com.android.application'
}

android {
    namespace 'biz.tujia.ime'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'biz.tujia.ime'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '0.4.0-dev.3'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('../shared/CMakeLists.txt')
            version '3.22.1'
        }
    }
    flavorDimensions += 'input'
    productFlavors {
        handwriting { dimension 'input' }
        typingOnly { dimension 'input' }
    }
    sourceSets {
        main.assets.srcDirs = ['../shared/bundle/Assets', 'src/main/assets']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

androidComponents {
    onVariants(selector().withFlavor(new kotlin.Pair('input', 'typingOnly'))) { variant ->
        variant.androidResources.ignoreAssetsPatterns.addAll('ismantic', 'handwriting', 'handwriting-readings.tsv', 'handwriting-tones.tsv')
    }
}

dependencies {
    handwritingImplementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}

apply from: rootProject.file('gradle/learning-assets.gradle')
