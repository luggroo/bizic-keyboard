import org.gradle.process.ExecOperations
import javax.inject.Inject

plugins {
    id 'com.android.application'
}

def keyboardOnly = providers.gradleProperty('keyboardOnly').map { it.toBoolean() }.getOrElse(false)

android {
    namespace 'biz.tujia.ime'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'biz.tujia.ime'
        minSdk 24
        targetSdk 35
        buildConfigField 'boolean', 'KEYBOARD_ONLY', keyboardOnly.toString()
        versionCode 18
        versionName '0.4.3'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }
    buildFeatures { buildConfig true }
    externalNativeBuild {
        cmake {
            path file('../shared/CMakeLists.txt')
            version '3.22.1'
        }
    }
    flavorDimensions += 'input'
    productFlavors {
        handwriting { dimension 'input' }
        typingOnly { dimension 'input' }
    }
    sourceSets {
        main.assets.srcDirs = []
        handwriting.assets.srcDirs = []
        if (keyboardOnly) main.manifest.srcFile 'src/keyboardOnly/AndroidManifest.xml'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def typingOnly = variant.productFlavors.any { it.second == 'typingOnly' }
        def task = tasks.register("prepare${variant.name.capitalize()}KeyboardAssets", PrepareKeyboardAssets) {
            script.set(rootProject.layout.projectDirectory.file('tools/prepare_keyboard_assets.py'))
            sourceFiles.from(rootProject.file('shared/bundle/Assets'), file('src/main/assets'), file('src/handwriting/assets'))
            typing.set(typingOnly)
        }
        variant.sources.assets.addGeneratedSourceDirectory(task, { it.outputDirectory })
    }
}

dependencies {
    handwritingImplementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}

if (!keyboardOnly) apply from: rootProject.file('gradle/learning-assets.gradle')


abstract class PrepareKeyboardAssets extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getScript()

    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getSourceFiles()

    @Input
    abstract Property<Boolean> getTyping()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void prepare() {
        def args = ['python3', script.get().asFile, outputDirectory.get().asFile]
        if (typing.get()) args.add('--typing-only')
        execOperations.exec { commandLine args }
    }
}
